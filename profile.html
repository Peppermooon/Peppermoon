<script>
const sb=window.supabase.createClient("https://bgzlqvbvmstebdsnzmqv.supabase.co","sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-"),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const q=new URLSearchParams(location.search).get('id');const s=(await sb.auth.getSession()).data.session;const id=q||(s&&s.user&&s.user.id);if(!id){root.innerHTML='<div class="placeholder">No profile selected.</div>';return}const r=await sb.from('profiles').select('*').eq('id',id).maybeSingle();if(!r.data){root.innerHTML='<div class="placeholder">Profile not found.</div>';return}const p=r.data,n=p.display_name||p.username||'User';document.title=n+' | Peppermoon';root.innerHTML=`<div class="card"><div class="head">${p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:`<div class="avatar">${esc(n.slice(0,1).toUpperCase())}</div>`}<div><h1>${esc(n)}</h1><div class="user">@${esc(p.username)}</div></div></div><div class="bio">${esc(p.bio||'This Peppermoon user has not added a bio yet.')}</div><div class="meta">Joined ${p.created_at?new Date(p.created_at).toLocaleDateString():''}</div></div><div class="placeholder">User posts, reviews and activity will appear here when the community features are added.</div>`})();

<script>
(function(){
  function label(){
    const btn=document.getElementById('pmThemeToggle');
    if(!btn)return;
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    btn.textContent=isLight?'☾ Dark':'☀ Light';
    btn.title=isLight?'Switch to dark mode':'Switch to light mode';
  }
  function toggle(){
    const current=document.documentElement.getAttribute('data-theme')||'dark';
    const next=current==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('peppermoon-theme',next);
    label();
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const btn=document.getElementById('pmThemeToggle');
    if(btn)btn.addEventListener('click',toggle);
    label();
  });
})();
</script>
