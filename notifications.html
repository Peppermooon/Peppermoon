<style>
:root{--bg:#07080c;--text:#f6f7fb;--muted:#9da5b5;--line:rgba(255,255,255,.09);--pink:#ff4f78;--violet:#7b61ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}
.top{border-bottom:1px solid var(--line);background:rgba(7,8,12,.9)}.nav{width:min(calc(100% - 30px),980px);margin:auto;min-height:72px;display:flex;align-items:center;gap:16px}
.brand{display:flex;gap:10px;align-items:center;font-size:1.35rem;font-weight:950}.brand img{width:38px;height:38px;object-fit:contain}.nav a.back{margin-left:auto;color:#aeb6c5}
.wrap{width:min(calc(100% - 30px),760px);margin:40px auto 80px}h1{font-size:2.3rem;margin:0 0 20px}
.list{display:grid;gap:10px}.n{display:flex;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}.n.unread{border-color:rgba(255,79,120,.28);background:rgba(255,79,120,.05)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--pink),var(--violet));font-weight:900;background-size:cover;background-position:center;flex:none}.body{flex:1}.msg{line-height:1.5}.time{margin-top:4px;color:#7f8999;font-size:.76rem}.empty{padding:22px;border:1px dashed var(--line);border-radius:16px;color:#8c96a7;text-align:center}
html[data-theme="light"]{--bg:#f6f7fa;--text:#161b29;--line:rgba(26,35,52,.11)}html[data-theme="light"] body{background:#f6f7fa;color:#161b29}html[data-theme="light"] .top{background:#fff}html[data-theme="light"] .n{background:#fff}html[data-theme="light"] .n.unread{background:#fff5f8}html[data-theme="light"] .nav a.back{color:#475467}

/* GLOBAL USER-CONTENT LINKS */
.content a,
.article-body a,
.article-content a,
.post-body a,
.comment-body a,
.item p a,
.bio a{
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:3px;
  overflow-wrap:anywhere;
}



/* =========================================================
   PEPPERMOON GLOBAL NAVIGATION CLEANUP
   ========================================================= */
.nav-links a,
nav a{
  position:relative;
}
.nav-links a.active,
nav a.active{
  color:var(--text) !important;
  font-weight:800 !important;
}
.nav-links a.active::after,
nav a.active::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:-8px;
  height:3px;
  border-radius:999px;
  background:linear-gradient(90deg,#ff4f78,#7b61ff);
}
html[data-theme="light"] .nav-links a.active,
html[data-theme="light"] nav a.active{
  color:#151925 !important;
}

/* The Peppermoon hero remains the original dark artwork in BOTH themes */
html[data-theme="light"] .hero-card,
html[data-theme="light"] .hero{
  background:
    radial-gradient(circle at 84% 30%,rgba(255,79,120,.24),transparent 28%),
    radial-gradient(circle at 38% 0%,rgba(123,97,255,.20),transparent 42%),
    linear-gradient(145deg,#14172c 0%,#17142c 42%,#100d18 72%,#190d17 100%) !important;
  color:#f6f7fb !important;
  border-color:rgba(255,255,255,.11) !important;
}
html[data-theme="light"] .hero-card *,
html[data-theme="light"] .hero *{
  color:inherit;
}
html[data-theme="light"] .hero-card h1,
html[data-theme="light"] .hero h1,
html[data-theme="light"] .hero-card .hero-title,
html[data-theme="light"] .hero .hero-title{
  color:#fff !important;
}
html[data-theme="light"] .hero-card p,
html[data-theme="light"] .hero p{
  color:#c8ccda !important;
}
html[data-theme="light"] .hero-card .eyebrow,
html[data-theme="light"] .hero .eyebrow{
  color:#fff !important;
}
html[data-theme="light"] .hero-card .secondary,
html[data-theme="light"] .hero .secondary{
  background:rgba(255,255,255,.07) !important;
  color:#fff !important;
  border-color:rgba(255,255,255,.12) !important;
}

/* Mobile active nav should read clearly inside hamburger menu */
@media(max-width:760px){
  .nav-links a.active::after,
  nav a.active::after{
    left:14px;
    right:auto;
    width:34px;
    bottom:5px;
  }
}


/* =========================================================
   V8 MOBILE APP SHELL
   ========================================================= */
.mobile-bottom-nav{display:none}
@media(max-width:760px){
  body{padding-bottom:78px !important}
  .hero-card{display:none !important}
  .topbar .nav,header .nav,.top .nav{min-height:64px !important;padding:8px 0 !important;flex-wrap:nowrap !important}
  .brand{font-size:1.14rem !important;gap:8px !important}
  .brand-logo-img,.brand img{width:34px !important;height:34px !important;flex:0 0 34px !important}
  .nav-links,nav.links,.top .links{display:none !important}
  .pm-auth-area{width:auto !important;order:initial !important;margin-left:auto !important;padding-top:0 !important;justify-content:flex-end !important}
  main{padding-top:0 !important}
  .mobile-bottom-nav{position:fixed;left:10px;right:10px;bottom:10px;z-index:900;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.10);border-radius:20px;background:rgba(12,14,22,.94);backdrop-filter:blur(18px);box-shadow:0 16px 38px rgba(0,0,0,.28)}
  .mobile-bottom-nav a{min-width:0;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;color:#8f98aa;font-size:.67rem;font-weight:800;text-decoration:none}
  .mobile-bottom-nav a .mbn-icon{font-size:1.13rem;line-height:1}
  .mobile-bottom-nav a.active{color:#fff;background:rgba(255,79,120,.12)}
  html[data-theme="light"] .mobile-bottom-nav{background:rgba(255,255,255,.96);border-color:rgba(26,35,52,.11);box-shadow:0 14px 34px rgba(26,35,52,.14)}
  html[data-theme="light"] .mobile-bottom-nav a{color:#667085}
  html[data-theme="light"] .mobile-bottom-nav a.active{color:#151925;background:#fff1f5}
}


/* =========================================================
   V8.1 MOBILE APP ALIGNMENT FIX
   ========================================================= */
@media(max-width:760px){
  /* One clean app-bar row */
  .topbar .nav,
  header .nav,
  .top .nav{
    min-height:68px !important;
    padding:8px 0 !important;
    gap:7px !important;
    display:flex !important;
    flex-wrap:nowrap !important;
    align-items:center !important;
  }

  .brand{
    flex:1 1 auto !important;
    min-width:0 !important;
    max-width:none !important;
    font-size:1.02rem !important;
    gap:7px !important;
    overflow:hidden !important;
  }

  .brand span{
    display:block !important;
    min-width:0 !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
    white-space:nowrap !important;
  }

  .brand-logo-img,
  .brand img{
    width:34px !important;
    height:34px !important;
    flex:0 0 34px !important;
  }

  /* All utilities stay on the SAME row */
  .pm-auth-area{
    flex:0 0 auto !important;
    width:auto !important;
    order:initial !important;
    margin:0 !important;
    padding:0 !important;
    display:flex !important;
    align-items:center !important;
    justify-content:flex-end !important;
    gap:6px !important;
  }

  /* Theme becomes an icon-style app control */
  .pm-theme-toggle{
    width:42px !important;
    height:42px !important;
    min-height:42px !important;
    padding:0 !important;
    flex:0 0 42px !important;
    overflow:hidden !important;
    white-space:nowrap !important;
    font-size:0 !important;
    border-radius:13px !important;
    display:grid !important;
    place-items:center !important;
  }
  .pm-theme-toggle::before{
    content:"◐";
    font-size:1.05rem;
    line-height:1;
  }

  /* Logged-in user control shows the avatar only on mobile */
  .pm-user-menu{
    margin:0 !important;
    flex:0 0 auto !important;
  }
  .pm-user-trigger{
    width:46px !important;
    height:42px !important;
    min-height:42px !important;
    padding:3px !important;
    border-radius:13px !important;
    justify-content:center !important;
    gap:0 !important;
  }
  .pm-user-trigger .pm-user-name,
  .pm-user-trigger > span:last-child{
    display:none !important;
  }
  .pm-avatar{
    width:34px !important;
    height:34px !important;
    flex:0 0 34px !important;
  }

  /* Logged-out button becomes compact, but remains readable */
  .pm-auth-btn{
    min-height:42px !important;
    padding:8px 11px !important;
    font-size:.74rem !important;
    white-space:nowrap !important;
  }

  .nav-actions{
    flex:0 0 auto !important;
    margin:0 !important;
    order:initial !important;
    display:flex !important;
    gap:6px !important;
    align-items:center !important;
  }

  .icon-btn,
  .menu-toggle{
    width:42px !important;
    height:42px !important;
    min-width:42px !important;
    flex:0 0 42px !important;
    border-radius:13px !important;
  }

  /* Avoid the old second-row/search spacing affecting app-bar alignment */
  .search-panel{
    padding:8px 0 10px !important;
  }

  /* Feed begins much closer to app bar */
  .mobile-feed-intro{
    margin:18px 0 18px !important;
    padding:0 !important;
  }
  .mobile-feed-intro h1{
    margin:5px 0 6px !important;
    font-size:1.55rem !important;
  }
  .mobile-feed-intro p{
    font-size:.92rem !important;
  }

  /* Reduce website-like vertical whitespace */
  .section{
    padding-top:26px !important;
    padding-bottom:26px !important;
  }
  .section-head{
    margin-bottom:14px !important;
  }

  /* Bottom nav respects narrow phones */
  .mobile-bottom-nav{
    left:8px !important;
    right:8px !important;
    bottom:8px !important;
    gap:1px !important;
    padding-left:5px !important;
    padding-right:5px !important;
  }
  .mobile-bottom-nav a{
    padding:4px 2px !important;
    font-size:.63rem !important;
  }
  .mobile-bottom-nav a .mbn-icon{
    font-size:1.05rem !important;
  }
}

@media(max-width:390px){
  .brand{
    font-size:.96rem !important;
  }
  .pm-theme-toggle{
    width:38px !important;
    flex-basis:38px !important;
  }
  .pm-user-trigger{
    width:42px !important;
  }
  .icon-btn,
  .menu-toggle{
    width:38px !important;
    min-width:38px !important;
    flex-basis:38px !important;
  }
  .pm-auth-area,
  .nav-actions{
    gap:4px !important;
  }
}

</style>

<style>

/* PEPPERMOON PUBLIC AUTH */
.pm-auth-area{margin-left:auto;display:flex;align-items:center;gap:10px}

.pm-auth-btn,.pm-user-trigger{border:1px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(255,79,120,.16),rgba(123,97,255,.14));color:#fff;border-radius:13px;padding:10px 14px;font-weight:850;cursor:pointer}

.pm-user-menu{position:relative}

.pm-user-trigger{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);padding:7px 10px 7px 8px}

.pm-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ff4f78,#7b61ff);font-size:.78rem;font-weight:900;background-size:cover;background-position:center}

.pm-user-dropdown{position:absolute;top:calc(100% + 9px);right:0;min-width:190px;background:#11141d;border:1px solid rgba(255,255,255,.10);border-radius:15px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:none;z-index:150}

.pm-user-dropdown.open{display:block}

.pm-user-dropdown a,.pm-user-dropdown button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e9ecf3;padding:10px 11px;border-radius:10px;cursor:pointer}

.pm-user-dropdown a:hover,.pm-user-dropdown button:hover{background:rgba(255,255,255,.06)}

.pm-user-dropdown .danger{color:#ff9eaa}

.pm-auth-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:none;place-items:center;padding:18px}

.pm-auth-modal.open{display:grid}

.pm-auth-card{width:min(460px,100%);background:#0e1118;border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.48);overflow:hidden}

.pm-auth-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}

.pm-auth-head h2{margin:0;font-size:1.35rem}
.pm-auth-close{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:#fff;cursor:pointer}

.pm-auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}

.pm-auth-tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#b8bfcd;border-radius:11px;padding:10px;cursor:pointer;font-weight:850}

.pm-auth-tab.active{color:#fff;background:linear-gradient(135deg,rgba(255,79,120,.16),rgba(123,97,255,.15));border-color:rgba(255,79,120,.28)}

.pm-auth-body{padding:18px 20px 22px}
.pm-auth-form{display:none}
.pm-auth-form.active{display:block}

.pm-auth-field{display:grid;gap:7px;margin-bottom:13px}
.pm-auth-field label{font-size:.82rem;font-weight:800;color:#dce1ea}

.pm-auth-field input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:#0a0d13;color:#fff;outline:none}

.pm-auth-submit{width:100%;border:0;border-radius:12px;padding:12px 14px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff4f78,#ff7b60)}

.pm-auth-note{margin:10px 0 0;color:#8f97a8;font-size:.8rem;line-height:1.55}

.pm-auth-msg{display:none;margin-top:12px;padding:10px 11px;border-radius:10px;font-size:.84rem}
.pm-auth-msg.show{display:block}

.pm-auth-msg.ok{background:rgba(53,208,127,.10);border:1px solid rgba(53,208,127,.22);color:#a9efc6}

.pm-auth-msg.error{background:rgba(255,95,109,.10);border:1px solid rgba(255,95,109,.22);color:#ffb2bb}
.pm-auth-btn{padding:9px 10px;font-size:.82rem}
.pm-user-name{display:none}



.pm-social-auth{display:grid;gap:10px;margin-bottom:16px}

.pm-google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid rgba(255,255,255,.12);background:#fff;color:#17191f;
  border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer
}

.pm-google-btn:hover{background:#f2f3f6}

.pm-google-g{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-weight:1000;font-size:1.05rem;color:#4285f4;background:#fff
}

.pm-auth-divider{display:flex;align-items:center;gap:10px;color:#778091;font-size:.76rem;font-weight:800;margin:2px 0 15px}

.pm-auth-divider:before,.pm-auth-divider:after{content:"";height:1px;background:rgba(255,255,255,.08);flex:1}

const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function text(n,name){if(n.type==='follow')return `<b>${esc(name)}</b> followed you.`;if(n.type==='like')return `<b>${esc(name)}</b> liked your post.`;if(n.type==='comment')return `<b>${esc(name)}</b> commented on your post.`;if(n.type==='reply')return `<b>${esc(name)}</b> replied to your comment.`;return `<b>${esc(name)}</b> interacted with you.`}
(async()=>{const s=(await sb.auth.getSession()).data.session;if(!s){$('list').innerHTML='<div class="empty">Log in to view notifications.</div>';return}
const r=await sb.from('notifications').select('id,type,post_id,comment_id,read,created_at,profiles!notifications_actor_id_fkey(username,display_name,avatar_url),posts(slug)').eq('recipient_id',s.user.id).order('created_at',{ascending:false}).limit(100);
if(r.error){$('list').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}
if(!r.data||!r.data.length){$('list').innerHTML='<div class="empty">No notifications yet.</div>';return}
$('list').innerHTML='';r.data.forEach(n=>{const p=n.profiles||{},name=p.display_name||p.username||'Peppermoon user';const e=document.createElement('a');e.className='n '+(n.read?'':'unread');e.href=(n.post_id&&n.posts&&n.posts.slug)?'post.html?slug='+encodeURIComponent(n.posts.slug):'community.html';const av=p.avatar_url?`<span class="av" style="background-image:url('${esc(p.avatar_url)}')"></span>`:`<span class="av">${esc(name.slice(0,1).toUpperCase())}</span>`;e.innerHTML=`${av}<div class="body"><div class="msg">${text(n,name)}</div><div class="time">${new Date(n.created_at).toLocaleString()}</div></div>`;$('list').appendChild(e)});
await sb.from('notifications').update({read:true}).eq('recipient_id',s.user.id).eq('read',false);
})();
</script>

<script>
(function(){
const sbAuth=window.supabase.createClient(
  "https://bgzlqvbvmstebdsnzmqv.supabase.co",
  "sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-",
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const $=id=>document.getElementById(id);

function setMsg(el,t,type='error'){
  if(!el)return;
  el.textContent=t;
  el.className='pm-auth-msg show '+type;
}

function cleanUsername(v){
  return String(v||'')
    .toLowerCase()
    .replace(/[^a-z0-9_]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_+|_+$/g,'')
    .slice(0,24);
}

async function usernameExists(username){
  const r=await sbAuth.from('profiles').select('id').eq('username',username).maybeSingle();
  return !!r.data;
}

async function buildSocialUsername(user){
  const meta=user.user_metadata||{};
  const emailPrefix=(user.email||'user').split('@')[0];
  let base=cleanUsername(meta.preferred_username || meta.user_name || emailPrefix || 'user');
  if(base.length<3)base='user';

  if(!(await usernameExists(base)))return base;

  const suffix=user.id.replace(/-/g,'').slice(0,5).toLowerCase();
  let candidate=(base.slice(0,18)+'_'+suffix).slice(0,24);
  if(!(await usernameExists(candidate)))return candidate;

  return ('user_'+user.id.replace(/-/g,'').slice(0,10)).slice(0,24);
}

async function ensureProfile(user){
  let r=await sbAuth.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(r.data)return r.data;

  const meta=user.user_metadata||{};
  let username=cleanUsername(meta.username);

  if(!username){
    username=await buildSocialUsername(user);
  }

  const displayName=
    meta.display_name ||
    meta.full_name ||
    meta.name ||
    username;

  const avatar=
    meta.avatar_url ||
    meta.picture ||
    null;

  const payload={
    id:user.id,
    username:username,
    display_name:displayName,
    avatar_url:avatar
  };

  const inserted=await sbAuth.from('profiles').insert(payload).select().maybeSingle();
  if(inserted.data)return inserted.data;

  // A rare username collision can occur between simultaneous signups.
  payload.username=('user_'+user.id.replace(/-/g,'').slice(0,10)).slice(0,24);
  const retry=await sbAuth.from('profiles').insert(payload).select().maybeSingle();
  return retry.data||null;
}

async function render(session){
 if(session?.user) $("pmOpenAuth").style.display="none"; $("pmOpenAuth").style.visibility="visible";
  if(!session||!session.user){
    $('pmOpenAuth').style.display='';
    $('pmUserMenu').style.display='none';
    return;
  }

  const p=await ensureProfile(session.user);

  if(!p){
    $('pmOpenAuth').style.display='none';
    $('pmUserMenu').style.display='block';
    $('pmUserName').textContent='Profile';
    $('pmAvatar').textContent='U';
    return;
  }

  const n=p.display_name||p.username||session.user.email||'User';
  $('pmOpenAuth').style.display='none';
  $('pmUserMenu').style.display='block';
  $('pmUserName').textContent=n;
  $('pmAvatar').textContent=n.slice(0,1).toUpperCase();

  if(p.avatar_url){
    $('pmAvatar').style.backgroundImage='url("'+p.avatar_url+'")';
    $('pmAvatar').textContent='';
  }

  $('pmProfileLink').href='profile.html?id='+encodeURIComponent(session.user.id);
}

$('pmOpenAuth').onclick=()=>$('pmAuthModal').classList.add('open');
$('pmCloseAuth').onclick=()=>$('pmAuthModal').classList.remove('open');

// Data-entry dialog intentionally does not close from backdrop clicks.
$('pmAuthModal').onclick=()=>{};

document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const login=b.dataset.authTab==='login';
  $('pmLoginForm').classList.toggle('active',login);
  $('pmSignupForm').classList.toggle('active',!login);
});

$('pmUserTrigger').onclick=()=>$('pmUserDropdown').classList.toggle('open');
document.addEventListener('click',e=>{
  if($('pmUserMenu') && !$('pmUserMenu').contains(e.target))
    $('pmUserDropdown').classList.remove('open');
});

$('pmGoogleLogin').onclick=async()=>{
  const r=await sbAuth.auth.signInWithOAuth({
    provider:'google',
    options:{
      redirectTo:window.location.origin + window.location.pathname + window.location.search
    }
  });

  if(r.error){
    setMsg($('pmLoginMsg'),r.error.message,'error');
  }
};

$('pmLoginForm').onsubmit=async e=>{
  e.preventDefault();

  const r=await sbAuth.auth.signInWithPassword({
    email:$('pmLoginEmail').value.trim(),
    password:$('pmLoginPassword').value
  });

  if(r.error){
    setMsg($('pmLoginMsg'),r.error.message,'error');
    return;
  }

  $('pmAuthModal').classList.remove('open');
};

$('pmSignupForm').onsubmit=async e=>{
  e.preventDefault();

  const username=cleanUsername($('pmSignupUsername').value);
  const dn=$('pmSignupDisplayName').value.trim();

  const chk=await sbAuth.from('profiles').select('id').eq('username',username).maybeSingle();
  if(chk.data){
    setMsg($('pmSignupMsg'),'Username already taken.','error');
    return;
  }

  const r=await sbAuth.auth.signUp({
    email:$('pmSignupEmail').value.trim(),
    password:$('pmSignupPassword').value,
    options:{
      data:{
        username:username,
        display_name:dn||username
      }
    }
  });

  if(r.error){
    setMsg($('pmSignupMsg'),r.error.message,'error');
    return;
  }

  if(r.data.session && r.data.user){
    await ensureProfile(r.data.user);
    $('pmAuthModal').classList.remove('open');
    return;
  }

  setMsg(
    $('pmSignupMsg'),
    'Account created. Confirm the email, then Peppermoon will recognize the session when you return.',
    'ok'
  );
};

$('pmLogout').onclick=async()=>{
  await sbAuth.auth.signOut();
  $('pmUserDropdown').classList.remove('open');
};

$('pmCreatePostPlaceholder').onclick=e=>{
  e.preventDefault();
  location.href='community.html#create';
};

$('pmSavedPlaceholder').onclick=e=>{e.preventDefault();location.href='profile.html#saved'};

(async()=>{
  const r=await sbAuth.auth.getSession();
  await render(r.data.session);
})();

sbAuth.auth.onAuthStateChange(async(_event,session)=>{
  await render(session);
  if(session && $('pmAuthModal')) $('pmAuthModal').classList.remove('open');
});
})();
</script></body></html>
