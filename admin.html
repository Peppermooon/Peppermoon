<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peppermoon Admin</title><link rel="icon" type="image/png" href="favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#07080c;--panel:#11141d;--text:#f6f7fb;--muted:#a9afbe;--line:rgba(255,255,255,.09);--pink:#ff4f78;--violet:#7b61ff;--green:#35d07f;--red:#ff6474}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% -10%,rgba(123,97,255,.2),transparent 30%),radial-gradient(circle at 95% 0%,rgba(255,79,120,.14),transparent 25%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}.hidden{display:none!important}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:rgba(7,8,12,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem}.brand img{width:34px;height:34px;border-radius:50%}.user{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.85rem}.wrap{width:min(1220px,calc(100% - 28px));margin:28px auto 60px}.login{min-height:72vh;display:grid;place-items:center}.card{width:min(430px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 25px 70px rgba(0,0,0,.35)}h1{letter-spacing:-.04em}.field{display:grid;gap:7px;margin:13px 0}label{font-size:.84rem;font-weight:800}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#0e1118;color:#fff;outline:none}textarea{min-height:170px;resize:vertical;line-height:1.55}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.06);color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--pink),#ff7b60);border:0}.danger{color:#ffadb5;border-color:rgba(255,100,116,.3);background:rgba(255,100,116,.1)}.small{padding:7px 10px;font-size:.8rem}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.03)}.stat b{display:block;font-size:1.7rem}.stat span{color:var(--muted);font-size:.82rem}.panel{border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.025);overflow:hidden}.panelhead{padding:15px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:8px}.filters input,.filters select{width:auto;min-width:150px;padding:8px 9px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:13px 15px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.74rem;color:#9299aa;text-transform:uppercase}.tablewrap{overflow:auto}.badge{padding:5px 8px;border-radius:999px;font-size:.7rem;font-weight:900;text-transform:uppercase}.pub{background:rgba(53,208,127,.11);color:#91efbb}.draft{background:rgba(255,179,71,.1);color:#ffd39a}.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.editor{width:min(980px,100%);max-height:94vh;overflow:auto;background:#0b0e14;border:1px solid var(--line);border-radius:22px}.editorhead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:rgba(11,14,20,.96);border-bottom:1px solid var(--line)}.editorbody{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.span2{grid-column:1/-1}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks input{width:auto}.preview{width:230px;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:13px;border:1px solid var(--line);margin-top:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.msg{margin-top:12px;padding:10px;border-radius:10px;display:none}.msg.ok{display:block;background:rgba(53,208,127,.1);color:#a8efc7}.msg.err{display:block;background:rgba(255,100,116,.1);color:#ffc0c6}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.user span{display:none}.panelhead{align-items:flex-start;flex-direction:column}.filters{width:100%;flex-direction:column}.filters input,.filters select{width:100%}}
</style></head><body><header><div class="brand"><img src="favicon.png" alt=""><span>Peppermoon Admin</span></div><div class="user hidden" id="userBar"><span id="userEmail"></span><a class="btn small" href="index.html" target="_blank">View Site</a><button class="btn small danger" id="logout">Logout</button></div></header><main class="wrap"><section class="login" id="loginView"><form class="card" id="loginForm"><h1>Admin Login</h1><p style="color:var(--muted);line-height:1.6">Use the Supabase account you created. There is no sign-up option here.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%">Login</button><div class="msg" id="loginMsg"></div></form></section><section class="hidden" id="dash"><div class="head"><div><h1>Content Dashboard</h1><p style="color:var(--muted)">Create, edit, publish and delete Peppermoon articles.</p></div><button class="btn primary" id="newBtn">+ New Article</button></div><div class="stats"><div class="stat"><b id="sAll">0</b><span>All articles</span></div><div class="stat"><b id="sPub">0</b><span>Published</span></div><div class="stat"><b id="sDraft">0</b><span>Drafts</span></div><div class="stat"><b id="sFeat">0</b><span>Featured</span></div></div><section class="panel"><div class="panelhead"><strong>Articles</strong><div class="filters"><input id="search" placeholder="Search"><select id="filter"><option value="">All categories</option><option>Gaming</option><option>Movies</option><option>TV Series</option><option>Trending</option></select></div></div><div class="tablewrap"><table><thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Homepage</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><div class="modal hidden" id="modal"><div class="editor"><div class="editorhead"><h2 id="editorTitle">New Article</h2><button class="btn small" type="button" id="close">Close</button></div><form class="editorbody" id="articleForm"><input type="hidden" id="id"><input type="hidden" id="oldImage"><div class="grid"><div class="field span2"><label>Title</label><input id="title" required></div><div class="field"><label>Slug / URL name</label><input id="slug" required></div><div class="field"><label>Category</label><select id="category" required><option value="">Select</option><option>Gaming</option><option>Movies</option><option>TV Series</option><option>Trending</option></select></div><div class="field"><label>Author</label><input id="author" value="Peppermoon"></div><div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="field span2"><label>Short Summary</label><textarea id="summary" style="min-height:90px"></textarea></div><div class="field span2"><label>Featured Image</label><input id="image" type="file" accept="image/*"><img class="preview hidden" id="preview"></div><div class="field span2"><label>Article Content</label><textarea id="content" required placeholder="Write the full article here. Use blank lines between paragraphs."></textarea></div><div class="checks span2"><label><input id="featured" type="checkbox"> Featured</label><label><input id="homepage" type="checkbox"> Show on homepage</label></div></div><div class="msg" id="editorMsg"></div><div class="actions"><button type="button" class="btn danger hidden" id="deleteBtn">Delete</button><button type="button" class="btn" id="draftBtn">Save Draft</button><button type="submit" class="btn primary">Save / Publish</button></div></form></div></div><script>
const sb=window.supabase.createClient("https://bgzlqvbvmstebdsnzmqv.supabase.co","sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-");const BUCKET="article-images";let articles=[];let autoSlug=true;const $=x=>document.getElementById(x);const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(el,t,ok=false){el.className='msg '+(ok?'ok':'err');el.textContent=t}function clear(el){el.className='msg';el.textContent=''}async function sessionView(s){if(s){$('loginView').classList.add('hidden');$('dash').classList.remove('hidden');$('userBar').classList.remove('hidden');$('userEmail').textContent=s.user.email||'';await load()}else{$('loginView').classList.remove('hidden');$('dash').classList.add('hidden');$('userBar').classList.add('hidden')}};(async()=>{const{data:{session}}=await sb.auth.getSession();sessionView(session);sb.auth.onAuthStateChange((e,s)=>sessionView(s))})();$('loginForm').onsubmit=async e=>{e.preventDefault();clear($('loginMsg'));const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg($('loginMsg'),error.message)};$('logout').onclick=()=>sb.auth.signOut();async function load(){const{data,error}=await sb.from('articles').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}articles=data||[];render()}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const list=articles.filter(a=>(!q||(a.title+' '+(a.summary||'')).toLowerCase().includes(q))&&(!f||a.category===f));$('rows').innerHTML=list.map(a=>`<tr><td><strong>${esc(a.title)}</strong><br><small style="color:#8f97a8">${esc(a.slug)}</small></td><td>${esc(a.category)}</td><td><span class="badge ${a.status==='published'?'pub':'draft'}">${esc(a.status)}</span></td><td>${a.show_on_homepage?'Yes':'—'}${a.featured?' · Featured':''}</td><td><button class="btn small" onclick="editArticle('${a.id}')">Edit</button></td></tr>`).join('');$('sAll').textContent=articles.length;$('sPub').textContent=articles.filter(a=>a.status==='published').length;$('sDraft').textContent=articles.filter(a=>a.status!=='published').length;$('sFeat').textContent=articles.filter(a=>a.featured).length}$('search').oninput=render;$('filter').onchange=render;function openNew(){$('articleForm').reset();$('id').value='';$('oldImage').value='';$('author').value='Peppermoon';$('status').value='draft';$('preview').classList.add('hidden');$('deleteBtn').classList.add('hidden');$('editorTitle').textContent='New Article';autoSlug=true;clear($('editorMsg'));$('modal').classList.remove('hidden')}$('newBtn').onclick=openNew;$('close').onclick=()=>$('modal').classList.add('hidden');$('title').oninput=()=>{if(autoSlug)$('slug').value=slugify($('title').value)};$('slug').oninput=()=>{autoSlug=false;$('slug').value=slugify($('slug').value)};$('image').onchange=()=>{const f=$('image').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}};window.editArticle=id=>{const a=articles.find(x=>String(x.id)===String(id));if(!a)return;$('id').value=a.id;$('title').value=a.title||'';$('slug').value=a.slug||'';$('category').value=a.category||'';$('author').value=a.author||'Peppermoon';$('status').value=a.status||'draft';$('summary').value=a.summary||'';$('content').value=a.content||'';$('featured').checked=!!a.featured;$('homepage').checked=!!a.show_on_homepage;$('oldImage').value=a.featured_image||'';$('image').value='';if(a.featured_image){$('preview').src=a.featured_image;$('preview').classList.remove('hidden')}else $('preview').classList.add('hidden');$('deleteBtn').classList.remove('hidden');$('editorTitle').textContent='Edit Article';autoSlug=false;clear($('editorMsg'));$('modal').classList.remove('hidden')};async function upload(file,slug){if(!file)return $('oldImage').value||null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${slug}-${Date.now()}.${ext}`;const{error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false});if(error)throw error;return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}async function save(forceDraft=false){clear($('editorMsg'));const title=$('title').value.trim(),slug=slugify($('slug').value||title),category=$('category').value,content=$('content').value.trim();if(!title||!slug||!category||!content){msg($('editorMsg'),'Please complete title, slug, category and content.');return}try{const image=await upload($('image').files[0],slug);const status=forceDraft?'draft':$('status').value;const now=new Date().toISOString();const payload={title,slug,category,summary:$('summary').value.trim()||null,content,featured_image:image,author:$('author').value.trim()||'Peppermoon',status,featured:$('featured').checked,show_on_homepage:$('homepage').checked,updated_at:now,published_at:status==='published'?now:null};let r;if($('id').value)r=await sb.from('articles').update(payload).eq('id',$('id').value);else r=await sb.from('articles').insert(payload);if(r.error)throw r.error;msg($('editorMsg'),forceDraft?'Draft saved.':'Article saved. ',true);await load();setTimeout(()=>$('modal').classList.add('hidden'),600)}catch(e){msg($('editorMsg'),e.message||String(e))}}$('articleForm').onsubmit=e=>{e.preventDefault();save(false)};$('draftBtn').onclick=()=>save(true);$('deleteBtn').onclick=async()=>{if(!confirm('Delete this article permanently?'))return;const{error}=await sb.from('articles').delete().eq('id',$('id').value);if(error){msg($('editorMsg'),error.message);return}await load();$('modal').classList.add('hidden')};
</script></body></html>
