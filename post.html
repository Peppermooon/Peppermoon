<!doctype html>
<html lang="en">
<head>
<script>(function(){const s=localStorage.getItem('peppermoon-theme');document.documentElement.setAttribute('data-theme',s==='light'?'light':'dark')})();</script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Post | Peppermoon</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07080c;--panel:#11141d;--text:#f6f7fb;--muted:#9da5b5;--line:rgba(255,255,255,.09);--pink:#ff4f78;--violet:#7b61ff;--max:1180px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,textarea{font:inherit}
.container{width:min(calc(100% - 28px),var(--max));margin:auto}.top{position:sticky;top:0;z-index:100;background:rgba(7,8,12,.93);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.nav{min-height:72px;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:9px;font-size:1.32rem;font-weight:950}.brand img{width:38px;height:38px}.links{display:flex;gap:20px;margin-left:auto}.links a{color:#aab2c2;font-weight:750;position:relative}.links a.active{color:#fff}.links a.active:after{content:"";position:absolute;left:10%;right:10%;bottom:-12px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--violet))}
.theme{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:11px;padding:9px 11px;cursor:pointer}
.main{width:min(calc(100% - 28px),860px);margin:32px auto 80px}.back{display:inline-block;color:#a9b1c0;margin-bottom:15px}
.post,.comments{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}.post-head{display:flex;gap:11px;align-items:center;padding:18px 20px 8px}.avatar,.cavatar{border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--pink),var(--violet));font-weight:900;background-size:cover;background-position:center;flex:none}.avatar{width:44px;height:44px}.cavatar{width:32px;height:32px}
.author{font-weight:900}.meta{font-size:.77rem;color:#818a9a}.content{padding:8px 20px 20px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:rgba(255,79,120,.08);border:1px solid rgba(255,79,120,.22);font-size:.72rem;font-weight:850;color:#ffc0ce}
h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.08;margin:12px 0 15px}.body,.comment-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.body{color:#d2d7e0}.body a,.comment-body a{color:#9eb0ff;text-decoration:underline;text-underline-offset:3px}
.post-img{width:100%;max-height:620px;object-fit:cover;display:block;border-top:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:13px 20px;border-top:1px solid var(--line)}.action{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#bac2cf;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.active{color:#fff!important;border-color:rgba(255,79,120,.3)!important;background:rgba(255,79,120,.10)!important}
.comments{margin-top:18px;padding:18px}.comments h2{margin:0 0 14px}.compose{display:flex;gap:8px;margin-bottom:15px}.compose textarea,.replybox textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);background:#0b0e15;color:var(--text);border-radius:11px;padding:10px}.compose textarea{flex:1}.submit{border:0;background:linear-gradient(135deg,var(--pink),#ff7186);color:#fff;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;align-self:flex-end}
.comment{padding:14px 0;border-top:1px solid var(--line)}.comment:first-child{border-top:0}.comment-top{display:flex;gap:9px;align-items:center}.cname{font-weight:850}.ctime{font-size:.72rem;color:#7f8999}.comment-body{margin:7px 0 7px 41px;color:#cbd0da}.tools{margin-left:41px;display:flex;gap:10px}.tiny{border:0;background:none;color:#8d96a6;padding:0;cursor:pointer}.replybox{margin:8px 0 0 41px;display:none}.replybox.open{display:block}.replies{margin-left:41px;border-left:2px solid rgba(123,97,255,.2);padding-left:13px}.state{padding:25px;border:1px dashed var(--line);border-radius:16px;color:#8c95a6;text-align:center}
html[data-theme="light"]{--bg:#f6f7fa;--panel:#fff;--text:#161b29;--line:rgba(26,35,52,.11)}html[data-theme="light"] .top{background:rgba(255,255,255,.94)}html[data-theme="light"] .links a{color:#5f6879}html[data-theme="light"] .links a.active{color:#151925}html[data-theme="light"] .theme,html[data-theme="light"] .action{background:#fff;color:#475467}html[data-theme="light"] .body,html[data-theme="light"] .comment-body{color:#465167}html[data-theme="light"] .compose textarea,html[data-theme="light"] .replybox textarea{background:#fff;color:#161b29}
@media(max-width:760px){.links{display:none}.theme{margin-left:auto}.main{margin-top:20px}.compose{flex-direction:column}.submit{width:100%}.comment-body,.tools,.replybox,.replies{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="container nav"><a class="brand" href="index.html"><img src="peppermoon-logo.png" alt=""><span>Peppermoon</span></a><nav class="links"><a href="gaming.html">Gaming</a><a href="movies.html">Movies</a><a href="tv.html">TV Series</a><a class="active" href="community.html">Community</a><a href="about.html">About</a></nav><button class="theme" id="themeBtn">Theme</button></div></header>
<main class="main"><a class="back" href="community.html">← Back to Community</a><div id="root"><div class="state">Loading post…</div></div></main>
<script>
const sb=window.supabase.createClient("https://bgzlqvbvmstebdsnzmqv.supabase.co","sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(v){const safe=esc(v);return safe.replace(/((?:https?:\/\/|www\.)[^\s<]+)/gi,raw=>{let u=raw,tr='';while(/[.,!?;:]$/.test(u)){tr=u.slice(-1)+tr;u=u.slice(0,-1)}const href=u.toLowerCase().startsWith('www.')?'https://'+u:u;return '<a href="'+href+'" target="_blank" rel="noopener noreferrer nofollow">'+u+'</a>'+tr})}
let session=null,post=null,comments=[];
async function loginRequired(){if(session)return true;alert('Please log in to interact with this post.');location.href='community.html';return false}
async function interactions(){const c=await sb.from('post_likes').select('*',{count:'exact',head:true}).eq('post_id',post.id);let liked=false,saved=false;if(session){const [l,s]=await Promise.all([sb.from('post_likes').select('post_id').eq('post_id',post.id).eq('user_id',session.user.id).maybeSingle(),sb.from('saved_posts').select('post_id').eq('post_id',post.id).eq('user_id',session.user.id).maybeSingle()]);liked=!!l.data;saved=!!s.data}return{count:c.count||0,liked,saved}}
async function notify(recipient,type,commentId=null){if(!session||!recipient||recipient===session.user.id)return;await sb.from('notifications').insert({recipient_id:recipient,actor_id:session.user.id,type,post_id:post.id,comment_id:commentId})}
async function toggleLike(){if(!(await loginRequired()))return;const r=await sb.from('post_likes').select('post_id').eq('post_id',post.id).eq('user_id',session.user.id).maybeSingle();if(r.data)await sb.from('post_likes').delete().eq('post_id',post.id).eq('user_id',session.user.id);else{const i=await sb.from('post_likes').insert({post_id:post.id,user_id:session.user.id});if(!i.error)await notify(post.author_id,'like')}await render()}
async function toggleSave(){if(!(await loginRequired()))return;const r=await sb.from('saved_posts').select('post_id').eq('post_id',post.id).eq('user_id',session.user.id).maybeSingle();if(r.data)await sb.from('saved_posts').delete().eq('post_id',post.id).eq('user_id',session.user.id);else await sb.from('saved_posts').insert({post_id:post.id,user_id:session.user.id});await render()}
async function loadComments(){const r=await sb.from('comments').select('id,post_id,author_id,parent_comment_id,body,status,created_at,profiles!comments_author_id_fkey(username,display_name,avatar_url)').eq('post_id',post.id).eq('status','published').order('created_at',{ascending:true});comments=r.data||[]}
async function addComment(parentId=null){if(!(await loginRequired()))return;const ta=$(parentId?'reply-'+parentId:'commentInput'),body=(ta.value||'').trim();if(!body)return;const r=await sb.from('comments').insert({post_id:post.id,author_id:session.user.id,parent_comment_id:parentId,body}).select('id').single();if(r.error){alert(r.error.message);return}let recipient=post.author_id,type='comment';if(parentId){type='reply';const pr=await sb.from('comments').select('author_id').eq('id',parentId).maybeSingle();if(pr.data)recipient=pr.data.author_id}await notify(recipient,type,r.data.id);await loadComments();await render()}
async function deleteComment(id){if(!session||!confirm('Delete this comment?'))return;const r=await sb.from('comments').delete().eq('id',id);if(r.error)alert(r.error.message);else{await loadComments();await render()}}
function renderComment(c){const p=c.profiles||{},name=p.display_name||p.username||'User',mine=!!(session&&session.user.id===c.author_id),children=comments.filter(x=>x.parent_comment_id===c.id);const av=p.avatar_url?`<span class="cavatar" style="background-image:url('${esc(p.avatar_url)}')"></span>`:`<span class="cavatar">${esc((name[0]||'U').toUpperCase())}</span>`;return `<div class="comment"><div class="comment-top">${av}<div><div class="cname"><a href="profile.html?id=${encodeURIComponent(c.author_id)}">${esc(name)}</a></div><div class="ctime">${new Date(c.created_at).toLocaleString()}</div></div></div><div class="comment-body">${linkify(c.body)}</div><div class="tools"><button class="tiny" data-reply="${c.id}">Reply</button>${mine?`<button class="tiny" data-delete="${c.id}">Delete</button>`:''}</div><div class="replybox" id="box-${c.id}"><textarea id="reply-${c.id}" placeholder="Write a reply…"></textarea><button class="submit" data-submit-reply="${c.id}">Reply</button></div>${children.length?`<div class="replies">${children.map(renderComment).join('')}</div>`:''}</div>`}
async function render(){const i=await interactions(),p=post.profiles||{},name=p.display_name||p.username||'Peppermoon User',av=p.avatar_url?`<div class="avatar" style="background-image:url('${esc(p.avatar_url)}')"></div>`:`<div class="avatar">${esc((name[0]||'P').toUpperCase())}</div>`,roots=comments.filter(c=>!c.parent_comment_id);$('root').innerHTML=`<article class="post"><div class="post-head">${av}<div><div class="author"><a href="profile.html?id=${encodeURIComponent(post.author_id)}">${esc(name)}</a></div><div class="meta">${esc(post.category)} · ${new Date(post.created_at).toLocaleString()}</div></div></div><div class="content"><span class="badge">${esc(post.post_type)}</span><h1>${esc(post.title)}</h1><div class="body">${linkify(post.body)}</div></div>${post.image_url?`<img class="post-img" src="${esc(post.image_url)}" alt="">`:''}<div class="actions"><button class="action ${i.liked?'active':''}" id="likeBtn">♥ ${i.count}</button><button class="action ${i.saved?'active':''}" id="saveBtn">${i.saved?'★ Saved':'☆ Save'}</button><button class="action" id="shareBtn">↗ Share</button></div></article><section class="comments"><h2>Comments (${comments.length})</h2><div class="compose"><textarea id="commentInput" placeholder="${session?'Write a comment…':'Log in to comment'}" ${session?'':'disabled'}></textarea><button class="submit" id="commentSubmit" ${session?'':'disabled'}>Comment</button></div>${roots.length?roots.map(renderComment).join(''):'<div class="state">No comments yet.</div>'}</section>`;$('likeBtn').onclick=toggleLike;$('saveBtn').onclick=toggleSave;$('shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:post.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};if($('commentSubmit'))$('commentSubmit').onclick=()=>addComment(null);document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>$('box-'+b.dataset.reply).classList.toggle('open'));document.querySelectorAll('[data-submit-reply]').forEach(b=>b.onclick=()=>addComment(Number(b.dataset.submitReply)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteComment(Number(b.dataset.delete)))}
(async()=>{session=(await sb.auth.getSession()).data.session;const slug=new URLSearchParams(location.search).get('slug');if(!slug){$('root').innerHTML='<div class="state">Post not found.</div>';return}const r=await sb.from('posts').select('id,author_id,slug,post_type,category,title,body,image_url,status,created_at,profiles!posts_author_id_fkey(username,display_name,avatar_url)').eq('slug',slug).eq('status','published').maybeSingle();if(r.error||!r.data){$('root').innerHTML='<div class="state">This post could not be found.</div>';return}post=r.data;document.title=post.title+' | Peppermoon Community';await loadComments();await render()})();
$('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||'dark',next=cur==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('peppermoon-theme',next)};
</script></body></html>
