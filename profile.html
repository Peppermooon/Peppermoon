<script>

function pmLinkify(value){
  const safe=String(value||'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  const urlRe=/((?:https?:\/\/|www\.)[^\s<]+)/gi;

  return safe.replace(urlRe,raw=>{
    let url=raw;
    let trailing='';

    while(/[.,!?;:]$/.test(url)){
      trailing=url.slice(-1)+trailing;
      url=url.slice(0,-1);
    }

    const href=url.toLowerCase().startsWith('www.') ? 'https://'+url : url;

    return '<a href="'+href+'" target="_blank" rel="noopener noreferrer nofollow">'+url+'</a>'+trailing;
  });
}

   ========================================================= */

/* 1) Anything sitting on the dark artwork/image area stays white in Light Mode */

html[data-theme="light"] .card-art *,

html[data-theme="light"] .card-art .badge,

}

/* Dark artwork labels remain dark translucent pills with white text */
html[data-theme="light"] .card-art .tag,

  border-color:rgba(255,255,255,.10) !important;

/* 2) Public login button is intentionally strong in BOTH themes */

/* =========================================================
   V6 PROFILE EDITING
   ========================================================= */
.profile-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.edit-profile-btn{
  border:1px solid rgba(255,79,120,.28);
  background:linear-gradient(135deg,#ff4f78,#ff6f86);

}
.edit-profile-btn:hover{transform:translateY(-1px)}
.profile-edit-modal{
  position:fixed;

  display:none;
  align-items:center;
  justify-content:center;

    </div>
    <div class="profile-edit-footer">
      <button class="profile-cancel" id="profileEditCancel" type="button">Cancel</button>
      <button class="profile-save" id="profileEditSave" type="button">Save changes</button>
    </div>
  </div>
</div>

<script>
const sb=window.supabase.createClient("https://bgzlqvbvmstebdsnzmqv.supabase.co","sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pid=null,session=null;
function ago(d){return new Date(d).toLocaleDateString()}
function items(list){const a=$('activity');if(!list||!list.length){a.innerHTML='<div class="empty">Nothing here yet.</div>';return}a.innerHTML='';list.forEach(p=>{const e=document.createElement('div');e.className='item';e.style.cursor='pointer';e.onclick=()=>location.href='community.html';e.innerHTML=`<div class="small">${esc(ago(p.created_at))}</div><h3>${esc(p.title)}</h3><p>${pmLinkify((p.body||'').slice(0,280))}</p>`;a.appendChild(e)})}
async function load(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('activity').innerHTML='<div class="empty">Loading…</div>';
if(tab==='posts'){const r=await sb.from('posts').select('id,title,body,created_at').eq('author_id',pid).eq('status','published').order('created_at',{ascending:false});items(r.data);return}
if(tab==='liked'){const r=await sb.from('post_likes').select('posts!post_likes_post_id_fkey(id,title,body,created_at,status)').eq('user_id',pid);items((r.data||[]).map(x=>x.posts).filter(x=>x&&x.status==='published'));return}
if(tab==='saved'){if(!session||!session.user||session.user.id!==pid){$('activity').innerHTML='<div class="empty">Saved posts are private.</div>';return}const r=await sb.from('saved_posts').select('posts!saved_posts_post_id_fkey(id,title,body,created_at,status)').eq('user_id',pid);items((r.data||[]).map(x=>x.posts).filter(x=>x&&x.status==='published'))}}


let currentProfile=null;
let pendingAvatarFile=null;

function profileError(msg=''){
  const e=$('profileEditError');
  e.textContent=msg;
  e.classList.toggle('show',!!msg);
}

function updateBioCount(){
  $('bioCount').textContent=String(($('bioInput').value||'').length);
}

function setAvatarPreview(url,name){
  const el=$('avatarPreview');
  if(url){
    el.textContent='';
    el.style.backgroundImage=`url("${url.replace(/"/g,'%22')}")`;
  }else{
    el.style.backgroundImage='';
    el.textContent=(name||'P').slice(0,1).toUpperCase();
  }
}

function openProfileEditor(){
  if(!session||!session.user||session.user.id!==pid||!currentProfile)return;
  pendingAvatarFile=null;
  $('avatarFile').value='';
  $('displayNameInput').value=currentProfile.display_name||'';
  $('usernameInput').value=currentProfile.username||'';
  $('bioInput').value=currentProfile.bio||'';
  updateBioCount();
  setAvatarPreview(currentProfile.avatar_url,currentProfile.display_name||currentProfile.username);
  profileError('');
  $('profileEditModal').classList.add('open');
  $('profileEditModal').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function closeProfileEditor(){
  $('profileEditModal').classList.remove('open');
  $('profileEditModal').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  pendingAvatarFile=null;
  if($('avatarFile'))$('avatarFile').value='';
}

async function uploadProfileAvatar(file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const safeExt=['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg';
  const path=`${session.user.id}/avatar-${Date.now()}.${safeExt}`;

  const up=await sb.storage.from('profile-avatars').upload(path,file,{
    cacheControl:'3600',
    upsert:false,
    contentType:file.type||undefined
  });
  if(up.error)throw up.error;

  const pub=sb.storage.from('profile-avatars').getPublicUrl(path);
  return pub.data.publicUrl;
}

async function saveProfileChanges(){
  if(!session||!session.user||session.user.id!==pid)return;

  const displayName=$('displayNameInput').value.trim();
  const username=$('usernameInput').value.trim().toLowerCase();
  const bio=$('bioInput').value.trim();

  if(displayName.length>50){
    profileError('Display name must be 50 characters or less.');
    return;
  }
  if(!/^[a-z0-9_]{3,30}$/.test(username)){
    profileError('Username must be 3–30 characters using only letters, numbers and underscores.');
    return;
  }

  profileError('');
  const btn=$('profileEditSave');
  const oldLabel=btn.textContent;
  btn.disabled=true;
  btn.textContent='Saving…';

  try{
    // Username uniqueness check, excluding the current profile.
    const existing=await sb.from('profiles')
      .select('id')
      .eq('username',username)
      .neq('id',session.user.id)
      .limit(1);

    if(existing.error)throw existing.error;
    if(existing.data&&existing.data.length){
      throw new Error('That username is already taken.');
    }

    let avatarUrl=currentProfile.avatar_url||null;
    if(pendingAvatarFile){
      avatarUrl=await uploadProfileAvatar(pendingAvatarFile);
    }

    const upd=await sb.from('profiles').update({
      username,
      display_name:displayName||null,
      bio:bio||null,
      avatar_url:avatarUrl,
      updated_at:new Date().toISOString()
    }).eq('id',session.user.id);

    if(upd.error)throw upd.error;

    currentProfile={
      ...currentProfile,
      username,
      display_name:displayName||null,
      bio:bio||null,
      avatar_url:avatarUrl
    };

    closeProfileEditor();
    renderProfileCard(currentProfile);
    await loadFollowState();
  }catch(err){
    profileError(err&&err.message?err.message:'Could not save profile.');
  }finally{
    btn.disabled=false;
    btn.textContent=oldLabel;
  }
}

function renderProfileCard(p){
  currentProfile=p;
  const n=p.display_name||p.username||'User';
  const own=!!(session&&session.user&&session.user.id===pid);

  $('profileRoot').innerHTML=`<section class="card">
    <div class="head">
      ${p.avatar_url
        ? `<div class="avatar" style="background-image:url('${esc(p.avatar_url)}')"></div>`
        : `<div class="avatar">${esc(n[0].toUpperCase())}</div>`}
      <div>
        <h1>${esc(n)}</h1>
        <div class="user">@${esc(p.username)}</div>
        <div class="follow-row" id="followRow">
          <button class="follow-btn" id="followBtn" style="display:none">Follow</button>
          <div class="follow-stats">
            <span><strong id="followersCount">0</strong> Followers</span>
            <span><strong id="followingCount">0</strong> Following</span>
          </div>
        </div>
        ${own?`<div class="profile-actions"><button class="edit-profile-btn" id="editProfileBtn" type="button">Edit profile</button></div>`:''}
      </div>
    </div>
    <div class="bio">${esc(p.bio||'This Peppermoon user has not added a bio yet.')}</div>
    <div class="meta">Joined ${p.created_at?new Date(p.created_at).toLocaleDateString():''}</div>
  </section>`;

  if(own&&$('editProfileBtn'))$('editProfileBtn').onclick=openProfileEditor;
}

async function loadFollowState(){
  const [fc,fg]=await Promise.all([
    sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',pid),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',pid)
  ]);
  $('followersCount').textContent=fc.count||0;
  $('followingCount').textContent=fg.count||0;

  if(!session||!session.user||session.user.id===pid){
    $('followBtn').style.display='none';
    return;
  }

  $('followBtn').style.display='';
  const r=await sb.from('follows')
    .select('follower_id')
    .eq('follower_id',session.user.id)
    .eq('following_id',pid)
    .maybeSingle();

  const following=!!r.data;
  $('followBtn').textContent=following?'Following':'Follow';
  $('followBtn').classList.toggle('following',following);

  $('followBtn').onclick=async()=>{
    if(following){
      const d=await sb.from('follows').delete()
        .eq('follower_id',session.user.id)
        .eq('following_id',pid);
      if(d.error){alert(d.error.message);return}
    }else{
      const i=await sb.from('follows').insert({
        follower_id:session.user.id,
        following_id:pid
      });
      if(i.error){alert(i.error.message);return}

      await sb.from('notifications').insert({
        recipient_id:pid,
        actor_id:session.user.id,
        type:'follow'
      });
    }
    await loadFollowState();
  };
}

(async()=>{session=(await sb.auth.getSession()).data.session;pid=new URLSearchParams(location.search).get('id')||(session&&session.user&&session.user.id);if(!pid)return;const r=await sb.from('profiles').select('*').eq('id',pid).maybeSingle();if(!r.data)return;const p=r.data;renderProfileCard(p);$('tabs').style.display='flex';if(!session||!session.user||session.user.id!==pid)$('savedTab').style.display='none';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(b.dataset.tab));
await loadFollowState();
const initialTab=(location.hash==='#saved' && session&&session.user&&session.user.id===pid)?'saved':'posts';
load(initialTab);
if(location.hash==='#edit' && session&&session.user&&session.user.id===pid){
  setTimeout(openProfileEditor,0);
}
})();

$('profileEditClose').onclick=closeProfileEditor;
$('profileEditCancel').onclick=closeProfileEditor;
$('profileEditSave').onclick=saveProfileChanges;
$('bioInput').addEventListener('input',updateBioCount);

$('avatarFile').addEventListener('change',()=>{
  const f=$('avatarFile').files&&$('avatarFile').files[0];
  if(!f)return;

  if(!['image/jpeg','image/png','image/webp'].includes(f.type)){
    profileError('Please choose a JPG, PNG or WebP image.');
    $('avatarFile').value='';
    return;
  }
  if(f.size>5*1024*1024){
    profileError('Profile picture must be 5 MB or smaller.');
    $('avatarFile').value='';
    return;
  }

  pendingAvatarFile=f;
  profileError('');
  const reader=new FileReader();
  reader.onload=()=>setAvatarPreview(reader.result,$('displayNameInput').value||$('usernameInput').value);
  reader.readAsDataURL(f);
});

/* Deliberately do NOT close the editor by clicking the backdrop.
   Close only with X or Cancel, matching Peppermoon data-entry modal behavior. */

function lab(){$('themeBtn').textContent=document.documentElement.getAttribute('data-theme')==='light'?'☾ Dark':'☀ Light'}$('themeBtn').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('peppermoon-theme',n);lab()};lab();
</script></body></html>
