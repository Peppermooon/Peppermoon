<!DOCTYPE html>
<html lang="en">
<head>

<script>
(function(){
  const saved=localStorage.getItem('peppermoon-theme');
  const theme=saved==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Article | Peppermoon</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07080c;--panel:#11141d;--text:#f6f7fb;--muted:#a9afbe;--line:rgba(255,255,255,.09);--pink:#ff4f78;--violet:#7b61ff;--max:1000px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:
radial-gradient(circle at 10% -8%,rgba(123,97,255,.18),transparent 30%),
radial-gradient(circle at 96% 3%,rgba(255,79,120,.13),transparent 24%),var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,12,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{width:min(calc(100% - 30px),1150px);margin:auto;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-weight:900;font-size:1.4rem;display:flex;gap:10px;align-items:center}
.brand img{width:36px;height:36px;border-radius:50%}
.links{display:flex;gap:18px;color:#d9dde7;font-weight:700;font-size:.9rem}
.wrap{width:min(calc(100% - 30px),var(--max));margin:55px auto 70px}
.meta{color:#9ba2b2;font-size:.84rem;margin-bottom:12px}
h1{font-size:clamp(2.5rem,6vw,5rem);line-height:.96;letter-spacing:-.06em;margin:10px 0 18px}
.summary{font-size:1.1rem;color:#c6cbd6;line-height:1.7;max-width:780px}
.cover{width:100%;max-height:560px;object-fit:cover;border-radius:24px;margin:30px 0;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.32)}
.content{font-size:1.05rem;line-height:1.85;color:#d1d5df}
.content p{margin:0 0 1.4em}
.content h2{font-size:2rem;line-height:1.2;letter-spacing:-.03em;margin:1.6em 0 .6em;color:#fff}
.content h3{font-size:1.45rem;line-height:1.25;margin:1.4em 0 .5em;color:#fff}
.content ul,.content ol{padding-left:1.5rem;margin:0 0 1.4em}
.content li{margin:.35em 0}
.content blockquote{padding:14px 18px;border-left:3px solid var(--pink);background:rgba(255,79,120,.06);border-radius:0 12px 12px 0;margin:1.5em 0;color:#e0dfe6}
.content a{color:#9eb0ff;text-decoration:underline}
.content img{max-width:100%;height:auto;display:block;margin:28px auto 8px;border-radius:18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 42px rgba(0,0,0,.25)}
.content figure{margin:32px 0;text-align:center}
.content figure img{margin-bottom:8px}
.content figcaption{font-size:.84rem;color:#929bad;line-height:1.5}
.error{padding:18px;border:1px solid rgba(255,79,120,.28);background:rgba(255,79,120,.08);border-radius:15px;color:#ffd3dc}
@media(max-width:700px){.links{display:none}.wrap{margin-top:35px}.content{font-size:1rem}}

/* FORCE READABLE ARTICLE TEXT */
.content,
.content p,
.content div,
.content span,
.content li,
.content ul,
.content ol,
.content blockquote {
  color:#d1d5df !important;
}

.content h1,
.content h2,
.content h3,
.content h4,
.content h5,
.content h6,
.content strong,
.content b {
  color:#ffffff !important;
}

.content figcaption {
  color:#929bad !important;
}

.content a {
  color:#9eb0ff !important;
}

.content * {
  background-color:transparent !important;
}


/* PEPPERMOON PUBLIC AUTH */
.pm-auth-area{margin-left:auto;display:flex;align-items:center;gap:10px}
.pm-auth-btn,.pm-user-trigger{border:1px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(255,79,120,.16),rgba(123,97,255,.14));color:#fff;border-radius:13px;padding:10px 14px;font-weight:850;cursor:pointer}
.pm-user-menu{position:relative}
.pm-user-trigger{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);padding:7px 10px 7px 8px}
.pm-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ff4f78,#7b61ff);font-size:.78rem;font-weight:900;background-size:cover;background-position:center}
.pm-user-dropdown{position:absolute;top:calc(100% + 9px);right:0;min-width:190px;background:#11141d;border:1px solid rgba(255,255,255,.10);border-radius:15px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:none;z-index:150}
.pm-user-dropdown.open{display:block}
.pm-user-dropdown a,.pm-user-dropdown button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e9ecf3;padding:10px 11px;border-radius:10px;cursor:pointer}
.pm-user-dropdown a:hover,.pm-user-dropdown button:hover{background:rgba(255,255,255,.06)}
.pm-user-dropdown .danger{color:#ff9eaa}
.pm-auth-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:none;place-items:center;padding:18px}
.pm-auth-modal.open{display:grid}
.pm-auth-card{width:min(460px,100%);background:#0e1118;border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.48);overflow:hidden}
.pm-auth-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.pm-auth-head h2{margin:0;font-size:1.35rem}.pm-auth-close{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:#fff;cursor:pointer}
.pm-auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0}
.pm-auth-tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#b8bfcd;border-radius:11px;padding:10px;cursor:pointer;font-weight:850}
.pm-auth-tab.active{color:#fff;background:linear-gradient(135deg,rgba(255,79,120,.16),rgba(123,97,255,.15));border-color:rgba(255,79,120,.28)}
.pm-auth-body{padding:18px 20px 22px}.pm-auth-form{display:none}.pm-auth-form.active{display:block}
.pm-auth-field{display:grid;gap:7px;margin-bottom:13px}.pm-auth-field label{font-size:.82rem;font-weight:800;color:#dce1ea}
.pm-auth-field input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:#0a0d13;color:#fff;outline:none}
.pm-auth-submit{width:100%;border:0;border-radius:12px;padding:12px 14px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff4f78,#ff7b60)}
.pm-auth-note{margin:10px 0 0;color:#8f97a8;font-size:.8rem;line-height:1.55}
.pm-auth-msg{display:none;margin-top:12px;padding:10px 11px;border-radius:10px;font-size:.84rem}.pm-auth-msg.show{display:block}
.pm-auth-msg.ok{background:rgba(53,208,127,.10);border:1px solid rgba(53,208,127,.22);color:#a9efc6}
.pm-auth-msg.error{background:rgba(255,95,109,.10);border:1px solid rgba(255,95,109,.22);color:#ffb2bb}
@media(max-width:620px){.pm-auth-btn{padding:9px 10px;font-size:.82rem}.pm-user-name{display:none}}


.pm-social-auth{display:grid;gap:10px;margin-bottom:16px}
.pm-google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid rgba(255,255,255,.12);background:#fff;color:#17191f;
  border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer
}
.pm-google-btn:hover{background:#f2f3f6}
.pm-google-g{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-weight:1000;font-size:1.05rem;color:#4285f4;background:#fff
}
.pm-auth-divider{display:flex;align-items:center;gap:10px;color:#778091;font-size:.76rem;font-weight:800;margin:2px 0 15px}
.pm-auth-divider:before,.pm-auth-divider:after{content:"";height:1px;background:rgba(255,255,255,.08);flex:1}


/* PEPPERMOON THEME TOGGLE */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f6fa !important;
  --panel:#ffffff !important;
  --panel2:#f0f2f7 !important;
  --text:#151821 !important;
  --muted:#667085 !important;
  --line:rgba(20,24,33,.12) !important;
}
html[data-theme="light"] body{
  background:#f5f6fa !important;
  color:#151821 !important;
}
html[data-theme="light"] header,
html[data-theme="light"] .top{
  background:rgba(255,255,255,.90) !important;
  border-color:rgba(20,24,33,.10) !important;
}
html[data-theme="light"] .card,
html[data-theme="light"] .post,
html[data-theme="light"] .filters,
html[data-theme="light"] .profile-card,
html[data-theme="light"] .pm-auth-card,
html[data-theme="light"] .pm-user-dropdown,
html[data-theme="light"] .modal-card,
html[data-theme="light"] .auth-card{
  background:#ffffff !important;
  color:#151821 !important;
  border-color:rgba(20,24,33,.10) !important;
}
html[data-theme="light"] .muted,
html[data-theme="light"] .post-meta,
html[data-theme="light"] .username,
html[data-theme="light"] .meta,
html[data-theme="light"] .pm-auth-note,
html[data-theme="light"] .file-note{
  color:#667085 !important;
}
html[data-theme="light"] .post-body,
html[data-theme="light"] .bio,
html[data-theme="light"] .hero p{
  color:#475467 !important;
}
html[data-theme="light"] input,
html[data-theme="light"] textarea,
html[data-theme="light"] select,
html[data-theme="light"] .rich-editor{
  background:#ffffff !important;
  color:#151821 !important;
  border-color:rgba(20,24,33,.14) !important;
}
html[data-theme="light"] .links,
html[data-theme="light"] .nav-links,
html[data-theme="light"] .pm-user-dropdown a,
html[data-theme="light"] .pm-user-dropdown button,
html[data-theme="light"] .dropdown a,
html[data-theme="light"] .dropdown button{
  color:#344054 !important;
}
html[data-theme="light"] .pm-auth-tab,
html[data-theme="light"] .filter-btn,
html[data-theme="light"] .secondary,
html[data-theme="light"] .action{
  color:#475467 !important;
}
html[data-theme="light"] .pm-auth-modal,
html[data-theme="light"] .modal,
html[data-theme="light"] .auth-modal{
  background:rgba(31,35,48,.40) !important;
}
.pm-theme-toggle{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.05);
  color:inherit;
  border-radius:12px;
  padding:9px 11px;
  cursor:pointer;
  font-weight:850;
  white-space:nowrap;
}
html[data-theme="light"] .pm-theme-toggle{
  border-color:rgba(20,24,33,.12);
  background:#ffffff;
  color:#344054;
}


/* PEPPERMOON UNIFIED PUBLIC LOGO */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:950;
  letter-spacing:-.045em;
}
.brand-mark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  position:relative;
  display:inline-block;
  background:
    radial-gradient(circle at 31% 28%,#ffffff 0 5.5%,transparent 6.5%),
    linear-gradient(145deg,#ff4f78,#7b61ff);
  box-shadow:0 0 26px rgba(255,79,120,.23), inset 0 0 16px rgba(255,255,255,.09);
}
.brand-mark::after{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  right:-3px;
  bottom:4px;
  background:#07080c;
}
html[data-theme="light"] .brand-mark::after{
  background:#ffffff;
}
html[data-theme="light"] .brand{
  color:#151925 !important;
}


/* =========================================================
   PEPPERMOON LIGHT MODE — FINAL PUBLIC OVERRIDES
   ========================================================= */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f7fa !important;
  --panel:#ffffff !important;
  --panel2:#f2f4f8 !important;
  --text:#161b29 !important;
  --muted:#66738c !important;
  --line:rgba(26,35,52,.11) !important;
}

html[data-theme="light"] body{
  background:#f6f7fa !important;
  color:#161b29 !important;
}

/* Main header/navigation */
html[data-theme="light"] header,
html[data-theme="light"] .top,
html[data-theme="light"] .topbar{
  background:rgba(255,255,255,.94) !important;
  border-color:rgba(26,35,52,.10) !important;
  color:#161b29 !important;
}

html[data-theme="light"] .links,

html[data-theme="light"] .links a{

}
html[data-theme="light"] .nav-links a:hover,
html[data-theme="light"] .nav-links a.active,
html[data-theme="light"] .links a:hover,
html[data-theme="light"] .links a.active{
  color:#151925 !important;
}

/* Fix previously invisible header/search/menu icons */
html[data-theme="light"] .icon-btn,
html[data-theme="light"] .menu-toggle{
  color:#344054 !important;
  background:#ffffff !important;
  border-color:rgba(26,35,52,.12) !important;
}
html[data-theme="light"] .search-panel{

}

  border-color:rgba(26,35,52,.11) !important;

}

/* Typography */
html[data-theme="light"] h1,
html[data-theme="light"] h2,
html[data-theme="light"] h3,
html[data-theme="light"] h4,
html[data-theme="light"] h5,
html[data-theme="light"] h6,

html[data-theme="light"] .section-title,
html[data-theme="light"] .card-title,

html[data-theme="light"] .comment-name{
  color:#151925 !important;
}

html[data-theme="light"] p,
html[data-theme="light"] .lead,
html[data-theme="light"] .description,
html[data-theme="light"] .post-body,
html[data-theme="light"] .comment-body,
html[data-theme="light"] .bio,
html[data-theme="light"] .content,
html[data-theme="light"] .content p,
html[data-theme="light"] .content div,
html[data-theme="light"] .content span,
html[data-theme="light"] .content li,
html[data-theme="light"] .article-body,
html[data-theme="light"] .article-body p{
  color:#586780 !important;
}

/* Keep strong text and article titles strongly legible */
html[data-theme="light"] strong,
html[data-theme="light"] b,
html[data-theme="light"] .content strong,
html[data-theme="light"] .content b{
  color:#1d2939 !important;
}

/* Secondary text */
html[data-theme="light"] .muted,
html[data-theme="light"] .meta,
html[data-theme="light"] .post-meta,
html[data-theme="light"] .username,
html[data-theme="light"] .file-note,
html[data-theme="light"] .pm-auth-note,
html[data-theme="light"] .comment-time,
html[data-theme="light"] .eyebrow-sub,
html[data-theme="light"] small{
  color:#748198 !important;
}

/* Cards/surfaces — mostly white with subtle grey separation */
html[data-theme="light"] .card,
html[data-theme="light"] .category-card,
html[data-theme="light"] .feature-card,
html[data-theme="light"] .content-card,
html[data-theme="light"] .post,
html[data-theme="light"] .comment-card,
html[data-theme="light"] .profile-card,
html[data-theme="light"] .filters,
html[data-theme="light"] .placeholder,
html[data-theme="light"] .panel,
html[data-theme="light"] .surface{
  background:#ffffff !important;
  color:#161b29 !important;
  border-color:rgba(26,35,52,.10) !important;
}

/* Preserve the soft tinted category-card look */

html[data-theme="light"] .feature-card{

}

/* Chips/badges/tags */

  border-color:rgba(26,35,52,.11) !important;
}

html[data-theme="light"] .user-btn{
  color:#344054 !important;
  background:#ffffff !important;
  border-color:rgba(26,35,52,.12) !important;
}
html[data-theme="light"] .pm-user-dropdown,
html[data-theme="light"] .dropdown,

  background:#ffffff !important;

  border-color:rgba(26,35,52,.11) !important;
}

  color:#475467 !important;

<body>
<header class="top">
  <div class="nav">
    <a class="brand" href="index.html"><img class="brand-logo-img" src="peppermoon-logo.png" alt=""><span>Peppermoon</span></a>
    <nav class="links"><a href="gaming.html">Gaming</a><a href="movies.html">Movies</a><a href="tv.html">TV Series</a><a href="trending.html">Trending</a></nav>
<div class="pm-auth-area" id="pmAuthArea">
  <button class="pm-theme-toggle" id="pmThemeToggle" type="button">☀ Light</button>

<script>
const sb=window.supabase.createClient("https://bgzlqvbvmstebdsnzmqv.supabase.co","sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-");
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function legacyToHtml(text) {
  if(!text) return '';
  if(/<[a-z][\s\S]*>/i.test(text)) return text;
  return String(text).split(/\n\s*\n/).filter(Boolean).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
}

(async()=>{
  const slug=new URLSearchParams(location.search).get('slug');

  if(!slug) {
    document.getElementById('articleWrap').innerHTML='<div class="error">Article not specified.</div>';
    return;
  }

  const {data,error}=await sb.from('articles')
    .select('*')
    .eq('slug',slug)
    .eq('status','published')
    .single();

  if(error||!data) {
    document.getElementById('articleWrap').innerHTML='<div class="error">This article could not be found or is not published.</div>';
    return;
  }

  document.title=data.title+' | Peppermoon';

  document.getElementById('articleWrap').innerHTML=`
    <div class="meta">${esc(data.category)} · ${esc(data.author||'Peppermoon')}${data.published_at?' · '+new Date(data.published_at).toLocaleDateString():''}</div>
    <h1>${esc(data.title)}</h1>
    ${data.summary?`<div class="summary">${esc(data.summary)}</div>`:''}
    ${data.featured_image?`<img class="cover" src="${data.featured_image}" alt="${esc(data.title)}">`:''}
    <article class="content">${legacyToHtml(data.content)}</article>
  `;
})();
</script>

<script>
(function(){
const sbAuth=window.supabase.createClient(
  "https://bgzlqvbvmstebdsnzmqv.supabase.co",
  "sb_publishable_Vr9Pah1UIb3EjRNTfT5vgg_VPnz3vl-",
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const $=id=>document.getElementById(id);

function setMsg(el,t,type='error'){
  if(!el)return;
  el.textContent=t;
  el.className='pm-auth-msg show '+type;
}

function cleanUsername(v){
  return String(v||'')
    .toLowerCase()
    .replace(/[^a-z0-9_]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_+|_+$/g,'')
    .slice(0,24);
}

async function usernameExists(username){
  const r=await sbAuth.from('profiles').select('id').eq('username',username).maybeSingle();
  return !!r.data;
}

async function buildSocialUsername(user){
  const meta=user.user_metadata||{};
  const emailPrefix=(user.email||'user').split('@')[0];
  let base=cleanUsername(meta.preferred_username || meta.user_name || emailPrefix || 'user');
  if(base.length<3)base='user';

  if(!(await usernameExists(base)))return base;

  const suffix=user.id.replace(/-/g,'').slice(0,5).toLowerCase();
  let candidate=(base.slice(0,18)+'_'+suffix).slice(0,24);
  if(!(await usernameExists(candidate)))return candidate;

  return ('user_'+user.id.replace(/-/g,'').slice(0,10)).slice(0,24);
}

async function ensureProfile(user){
  let r=await sbAuth.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(r.data)return r.data;

  const meta=user.user_metadata||{};
  let username=cleanUsername(meta.username);

  if(!username){
    username=await buildSocialUsername(user);
  }

  const displayName=
    meta.display_name ||
    meta.full_name ||
    meta.name ||
    username;

  const avatar=
    meta.avatar_url ||
    meta.picture ||
    null;

  const payload={
    id:user.id,
    username:username,
    display_name:displayName,
    avatar_url:avatar
  };

  const inserted=await sbAuth.from('profiles').insert(payload).select().maybeSingle();
  if(inserted.data)return inserted.data;

  // A rare username collision can occur between simultaneous signups.
  payload.username=('user_'+user.id.replace(/-/g,'').slice(0,10)).slice(0,24);
  const retry=await sbAuth.from('profiles').insert(payload).select().maybeSingle();
  return retry.data||null;
}

async function render(session){
  if(!session||!session.user){
    $('pmOpenAuth').style.display='';
    $('pmUserMenu').style.display='none';
    return;
  }

  const p=await ensureProfile(session.user);

  if(!p){
    $('pmOpenAuth').style.display='none';
    $('pmUserMenu').style.display='block';
    $('pmUserName').textContent='Profile';
    $('pmAvatar').textContent='U';
    return;
  }

  const n=p.display_name||p.username||session.user.email||'User';
  $('pmOpenAuth').style.display='none';
  $('pmUserMenu').style.display='block';
  $('pmUserName').textContent=n;
  $('pmAvatar').textContent=n.slice(0,1).toUpperCase();

  if(p.avatar_url){
    $('pmAvatar').style.backgroundImage='url("'+p.avatar_url+'")';
    $('pmAvatar').textContent='';
  }

  $('pmProfileLink').href='profile.html?id='+encodeURIComponent(session.user.id);
}

$('pmOpenAuth').onclick=()=>$('pmAuthModal').classList.add('open');
$('pmCloseAuth').onclick=()=>$('pmAuthModal').classList.remove('open');

// Data-entry dialog intentionally does not close from backdrop clicks.
$('pmAuthModal').onclick=()=>{};

document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const login=b.dataset.authTab==='login';
  $('pmLoginForm').classList.toggle('active',login);
  $('pmSignupForm').classList.toggle('active',!login);
});

$('pmUserTrigger').onclick=()=>$('pmUserDropdown').classList.toggle('open');
document.addEventListener('click',e=>{
  if($('pmUserMenu') && !$('pmUserMenu').contains(e.target))
    $('pmUserDropdown').classList.remove('open');
});

$('pmGoogleLogin').onclick=async()=>{
  const r=await sbAuth.auth.signInWithOAuth({
    provider:'google',
    options:{
      redirectTo:"https://peppermooon.github.io/Peppermoon/"
    }
  });

  if(r.error){
    setMsg($('pmLoginMsg'),r.error.message,'error');
  }
};

$('pmLoginForm').onsubmit=async e=>{
  e.preventDefault();

  const r=await sbAuth.auth.signInWithPassword({
    email:$('pmLoginEmail').value.trim(),
    password:$('pmLoginPassword').value
  });

  if(r.error){
    setMsg($('pmLoginMsg'),r.error.message,'error');
    return;
  }

  $('pmAuthModal').classList.remove('open');
};

$('pmSignupForm').onsubmit=async e=>{
  e.preventDefault();

  const username=cleanUsername($('pmSignupUsername').value);
  const dn=$('pmSignupDisplayName').value.trim();

  const chk=await sbAuth.from('profiles').select('id').eq('username',username).maybeSingle();
  if(chk.data){
    setMsg($('pmSignupMsg'),'Username already taken.','error');
    return;
  }

  const r=await sbAuth.auth.signUp({
    email:$('pmSignupEmail').value.trim(),
    password:$('pmSignupPassword').value,
    options:{
      data:{
        username:username,
        display_name:dn||username
      }
    }
  });

  if(r.error){
    setMsg($('pmSignupMsg'),r.error.message,'error');
    return;
  }

  if(r.data.session && r.data.user){
    await ensureProfile(r.data.user);
    $('pmAuthModal').classList.remove('open');
    return;
  }

  setMsg(
    $('pmSignupMsg'),
    'Account created. Confirm the email, then Peppermoon will recognize the session when you return.',
    'ok'
  );
};

$('pmLogout').onclick=async()=>{
  await sbAuth.auth.signOut();
  $('pmUserDropdown').classList.remove('open');
};

$('pmCreatePostPlaceholder').onclick=e=>{
  e.preventDefault();
  location.href='community.html#create';
};

$('pmSavedPlaceholder').onclick=e=>{
  e.preventDefault();
  alert('Saved content is coming next.');
};

(async()=>{
  const r=await sbAuth.auth.getSession();
  await render(r.data.session);
})();

sbAuth.auth.onAuthStateChange(async(_event,session)=>{
  await render(session);
  if(session && $('pmAuthModal')) $('pmAuthModal').classList.remove('open');
});
})();
</script>


<script>
(function(){
  function label(){
    const btn=document.getElementById('pmThemeToggle');
    if(!btn)return;
    const isLight=document.documentElement.getAttribute('data-theme')==='light';
    btn.textContent=isLight?'☾ Dark':'☀ Light';
    btn.title=isLight?'Switch to dark mode':'Switch to light mode';
  }
  function toggle(){
    const current=document.documentElement.getAttribute('data-theme')||'dark';
    const next=current==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('peppermoon-theme',next);
    label();
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const btn=document.getElementById('pmThemeToggle');
    if(btn)btn.addEventListener('click',toggle);
    label();
  });
})();
</script>
